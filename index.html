    function queueSnakeOrCursor(keyName) {
      if (state.roomPhase !== 'minigame' || !state.mg.active || !state.activeRoom) return;
      const rId = state.activeRoom.id;
      const mg = state.mg;
      if (rId === 'rad') {

          ArrowLeft: { x: -1, y: 0 }, ArrowRight: { x: 1, y: 0 },
          ArrowUp: { x: 0, y: -1 }, ArrowDown: { x: 0, y: 1 }
        };
        const nd = map[keyName];
        if (!nd) return;
        const last = mg.dirQueue.length ? mg.dirQueue[mg.dirQueue.length - 1] : mg.snakeDir;
        if ((nd.x !== -last.x || nd.y !== -last.y) && (nd.x !== last.x || nd.y !== last.y) && mg.dirQueue.length < 2) {
          mg.dirQueue.push(nd);
        }
      } else if (rId === 'server') {
        if (keyName === 'ArrowLeft') mg.selCol = Math.max(0, mg.selCol - 1);
        if (keyName === 'ArrowRight') mg.selCol = Math.min(4, mg.selCol + 1);
        if (keyName === 'ArrowUp') mg.selRow = Math.max(0, mg.selRow - 1);
        if (keyName === 'ArrowDown') mg.selRow = Math.min(2, mg.selRow + 1);
      } else if (rId === 'boss') {
        if (keyName === 'ArrowLeft' || keyName === 'ArrowUp') mg.selMove = (mg.selMove + 2) % 3;
        if (keyName === 'ArrowRight' || keyName === 'ArrowDown') mg.selMove = (mg.selMove + 1) % 3;

    }

    function isMapWalkable(px, py) {
      if (px >= 28 && px <= 932 && py >= 254 && py <= 308) return true;
      for (let i = 0; i < ROOMS.length; i++) {
        if (!isRoomUnlocked(i)) continue;
        const r = ROOMS[i];
        const [dx1, dx2] = r.doorX;
        const b = r.roomBounds;
        if (r.num <= 3 && px >= dx1 + 8 && px <= dx2 - 8 && py >= b.y2 - 10 && py <= 262) return true;
        if (r.num >= 4 && px >= dx1 + 8 && px <= dx2 - 8 && py >= 300 && py <= b.y1 + 15) return true;
        if (px >= b.x1 && px <= b.x2 && py >= b.y1 && py <= b.y2) {
          if (r.id === 'or' && px > 122 && px < 218 && py > 95 && py < 138) return false;

      return false;

    // --- HELPERS FOR THE 5 DISTINCT MINI-CHALLENGES ---
    const OR_PATH = [
      { x: 54, y: 148 }, { x: 142, y: 148 }, { x: 210, y: 74 },
      { x: 312, y: 74 }, { x: 382, y: 196 }, { x: 462, y: 196 }, { x: 514, y: 128 }
    ];

    function distToSegment(px, py, ax, ay, bx, by) {
      const vx = bx - ax, vy = by - ay;
      const wx = px - ax, wy = py - ay;
      const c1 = vx * wx + vy * wy;
      if (c1 <= 0) return Math.hypot(px - ax, py - ay);
      const c2 = vx * vx + vy * vy;
      if (c2 <= c1) return Math.hypot(px - bx, py - by);
      const t = c1 / c2;
      return Math.hypot(px - (ax + t * vx), py - (ay + t * vy));
    }

    function distToOrPath(px, py) {
      let best = 9999;
      for (let i = 0; i < OR_PATH.length - 1; i++) {
        const d = distToSegment(px, py, OR_PATH[i].x, OR_PATH[i].y, OR_PATH[i + 1].x, OR_PATH[i + 1].y);
        if (d < best) best = d;
      }
      return best;
    }

    function spawnParticles(x, y, col, count) {

    function spawnSnakeFood() {

      for (let tries = 0; tries < 100; tries++) {

        if (!onSnake && !onLock) {
          mg.food = { x: fx, y: fy };
          return;
        }
      }
    }

    function getPipePorts(type, rot) {
      // [N, E, S, W]
      const base = type === 'I' ? [1, 0, 1, 0] : (type === 'L' ? [1, 1, 0, 0] : [1, 1, 0, 1]);
      const out = [0, 0, 0, 0];
      for (let i = 0; i < 4; i++) out[(i + rot) % 4] = base[i];
      return out;
    }

    function recomputePipeFlow() {
      const mg = state.mg;
      mg.pipes.forEach(row => row.forEach(cell => { cell.powered = false; }));
      if (!mg.pipes.length) return;
      const start = mg.pipes[1][0];
      const sPorts = getPipePorts(start.type, start.rot);
      if (!sPorts[3]) return; // Must connect West to the PNRR Cabinet
      start.powered = true;
      const q = [{ c: 0, r: 1 }];
      const dirs = [
        { dc: 0, dr: -1, pOut: 0, pIn: 2 },
        { dc: 1, dr: 0, pOut: 1, pIn: 3 },
        { dc: 0, dr: 1, pOut: 2, pIn: 0 },
        { dc: -1, dr: 0, pOut: 3, pIn: 1 }
      ];
      while (q.length) {
        const cur = q.shift();
        const cPorts = getPipePorts(mg.pipes[cur.r][cur.c].type, mg.pipes[cur.r][cur.c].rot);
        dirs.forEach(d => {
          if (!cPorts[d.pOut]) return;
          const nc = cur.c + d.dc, nr = cur.r + d.dr;
          if (nc < 0 || nc > 4 || nr < 0 || nr > 2) return;
          const nextCell = mg.pipes[nr][nc];
          if (nextCell.powered) return;
          const nPorts = getPipePorts(nextCell.type, nextCell.rot);
          if (nPorts[d.pIn]) {
            nextCell.powered = true;
            q.push({ c: nc, r: nr });
          }
        });
      }
      const endCell = mg.pipes[1][4];
      const ePorts = getPipePorts(endCell.type, endCell.rot);
      let litCount = 0;
      mg.pipes.forEach(row => row.forEach(cell => { if (cell.powered) litCount++; }));
      mg.progress = endCell.powered && ePorts[1] ? 100 : Math.min(90, litCount * 10);
      if (endCell.powered && ePorts[1] && !mg.pipeSolved) {
        mg.pipeSolved = true;
        mg.pipeSolvedTimer = 42;
        playSfx('good');
        spawnParticles(475, 144, '#10b981', 28);
      }
    }

    function rotatePipeTile(col, row) {
      const mg = state.mg;
      if (!mg.pipes[row] || !mg.pipes[row][col] || mg.pipeSolved) return;
      mg.pipes[row][col].rot = (mg.pipes[row][col].rot + 1) % 4;
      playSfx('open');
      recomputePipeFlow();

    function triggerBossMove(mIdx) {
      const mg = state.mg;
      if (mg.roundIdx >= BOSS_ROUNDS.length) return;
      const rd = BOSS_ROUNDS[mg.roundIdx];
      const mv = rd.moves[mIdx];
      if (!mv) return;
      if (mv.ok) {
        playSfx('good');
        mg.duelFlash = 18;
        mg.duelMsg = rd.mentorOk;
        spawnParticles(435, 68, '#10b981', 26);
        mg.roundIdx++;

    function handleMiniMouseMove(ev) {
      const mc = document.getElementById('miniCanvas');
      if (!mc || !state.mg.active || !state.activeRoom) return;
      const rect = mc.getBoundingClientRect();
      const mx = ((ev.clientX - rect.left) / rect.width) * 560;
      const my = ((ev.clientY - rect.top) / rect.height) * 260;
      const rId = state.activeRoom.id;
      if (rId === 'or') {
        state.mg.mouseTarget = { x: mx, y: my };
      } else if (rId === 'conv') {
        state.mg.px = Math.max(state.mg.paddleW / 2 + 8, Math.min(552 - state.mg.paddleW / 2, mx));
      }
    }

    function handleMiniClick(ev) {
      const mc = document.getElementById('miniCanvas');
      if (!mc || !state.mg.active || !state.activeRoom) return;
      const rect = mc.getBoundingClientRect();
      const mx = ((ev.clientX - rect.left) / rect.width) * 560;
      const my = ((ev.clientY - rect.top) / rect.height) * 260;
      const rId = state.activeRoom.id;
      const mg = state.mg;

      if (rId === 'server') {
        const col = Math.floor((mx - 110) / 68);
        const row = Math.floor((my - 48) / 64);
        if (col >= 0 && col <= 4 && row >= 0 && row <= 2) {
          mg.selCol = col; mg.selRow = row;
          rotatePipeTile(col, row);
        }
      } else if (rId === 'rad') {
        const head = mg.snake[0];
        if (!head) return;
        const hx = 20 + head.x * 26 + 13;
        const hy = 30 + head.y * 22 + 11;
        const dx = mx - hx, dy = my - hy;
        if (Math.abs(dx) > Math.abs(dy)) queueSnakeOrCursor(dx > 0 ? 'ArrowRight' : 'ArrowLeft');
        else queueSnakeOrCursor(dy > 0 ? 'ArrowDown' : 'ArrowUp');
      } else if (rId === 'boss') {
        if (my >= 198 && my <= 254) {
          const idx = Math.min(2, Math.max(0, Math.floor((mx - 14) / 178)));
          mg.selMove = idx;
          triggerBossMove(idx);
        }
      }
    }

    function commitRoomDecision(cIdx) {
      const r = state.activeRoom;
      if (!r || state.completed[r.id]) return;
      const c = r.choices[cIdx];

      state.budget = Math.max(0, state.budget + c.deltas.budget);
      state.clinical = Math.max(0, Math.min(100, state.clinical + c.deltas.clinical));
      let pAdd = c.deltas.papers;
      if (c.activatesFiber) {
        state.fiberActive = true;
        if (state.hospitalType === 'sud') pAdd = +(pAdd * 1.35).toFixed(3);
      }
      state.aiPapers = Math.max(0, +(state.aiPapers + pAdd).toFixed(3));
      state.completed[r.id] = c;
      state.roomPhase = 'result';

      // Completing Chapter 5 immediately triggers the big WINNER! celebration screen!
      if (r.id === 'boss') {
        openWinnerCelebration();
        return;
      }

      playSfx(c.ok ? 'good' : 'bad');
      renderHudBar();
      renderModalAndTheory();
    }

    function closeRoomEncounter() {
      if (state.activeRoom) state.dismissedRoomId = state.activeRoom.id;

    // =========================================================================

    // =========================================================================
    function drawPixelCharacter(ctx, x, y, coatCol, hairCol, dir, frame, isMoving, label, labelCol, isMentor) {
      const bob = isMoving ? Math.round(Math.sin(frame * 0.45) * 2) : 0;
      const step = isMoving ? Math.sin(frame * 0.45) * 4 : 0;

      ctx.save();
      ctx.translate(Math.round(x), Math.round(y));

      // Floor shadow
      ctx.fillStyle = isMentor ? 'rgba(56, 189, 248, 0.32)' : 'rgba(15, 23, 42, 0.42)';
      ctx.beginPath();
      ctx.ellipse(0, 6, isMentor ? 13 : 11, 5.5, 0, 0, Math.PI * 2);
      ctx.fill();

      // Animated legs
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(-6, -6 + Math.round(step * 0.5), 5, 11);
      ctx.fillRect(1, -6 - Math.round(step * 0.5), 5, 11);

      // Shoes
      ctx.fillStyle = '#020617';
      ctx.fillRect(-6, 4 + Math.round(step * 0.5), 5, 3);
      ctx.fillRect(1, 4 - Math.round(step * 0.5), 5, 3);

      // Navy crew-neck sweater (Turin Professor) or lab coat / suit
      ctx.fillStyle = isMentor ? '#1e3a5f' : coatCol;
      ctx.beginPath();
      ctx.roundRect(-10, -22 + bob, 20, 18, 4);
      ctx.fill();
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 1.6;
      ctx.stroke();

      if (isMentor) {
        // Open white shirt collar under dark navy sweater + econometric tablet
        ctx.fillStyle = '#f8fafc';
        ctx.beginPath();
        ctx.moveTo(-5, -22 + bob);
        ctx.lineTo(0, -16 + bob);
        ctx.lineTo(5, -22 + bob);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#0f172a';
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.roundRect(8, -17 + bob, 8, 10, 2);
        ctx.fill();
        ctx.stroke();
      } else if (dir !== 'up') {
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(-2, -20 + bob, 4, 11);
      }

      // Arms
      ctx.fillStyle = isMentor ? '#1e3a5f' : coatCol;
      ctx.fillRect(-13, -20 + bob - Math.round(step * 0.4), 4, 12);
      if (!isMentor) ctx.fillRect(9, -20 + bob + Math.round(step * 0.4), 4, 12);

      // Head
      ctx.fillStyle = '#fed7aa';
      ctx.beginPath();
      ctx.arc(0, -30 + bob, 9.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      if (isMentor) {
        // Tapered wavy salt-and-pepper hair & dark rectangular glasses
        const waves = [
          { cx: -7.5, cy: -34.5, r: 3.6, c: '#334155' },
          { cx: -3.5, cy: -38.0, r: 4.0, c: '#64748b' },
          { cx: 1.5,  cy: -38.5, r: 4.2, c: '#475569' },
          { cx: 6.0,  cy: -37.0, r: 3.8, c: '#94a3b8' },
          { cx: 8.5,  cy: -33.5, r: 3.3, c: '#334155' }
        ];
        waves.forEach(cl => {
          ctx.fillStyle = cl.c;
          ctx.beginPath();
          ctx.arc(cl.cx, cl.cy + bob, cl.r, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.fillStyle = 'rgba(224, 242, 254, 0.55)';
        ctx.fillRect(-7.5, -33 + bob, 6.2, 4.5);
        ctx.fillRect(1.3, -33 + bob, 6.2, 4.5);
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 1.7;
        ctx.strokeRect(-7.5, -33 + bob, 6.2, 4.5);
        ctx.strokeRect(1.3, -33 + bob, 6.2, 4.5);
        ctx.beginPath();
        ctx.moveTo(-1.3, -31 + bob); ctx.lineTo(1.3, -31 + bob);
        ctx.stroke();
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(-5, -31.5 + bob, 1.8, 2);
        ctx.fillRect(3.6, -31.5 + bob, 1.8, 2);
        ctx.beginPath();
        ctx.arc(0, -26.5 + bob, 2.8, 0.15 * Math.PI, 0.85 * Math.PI);
        ctx.lineWidth = 1.2;
        ctx.stroke();
      } else {
        ctx.fillStyle = hairCol;
        if (dir === 'up') {
          ctx.beginPath(); ctx.arc(0, -30 + bob, 9.5, 0, Math.PI * 2); ctx.fill();
        } else {
          ctx.beginPath(); ctx.arc(0, -33 + bob, 9.5, Math.PI * 0.92, Math.PI * 0.08); ctx.fill();
          ctx.fillStyle = '#0f172a';
          const eyeOff = dir === 'left' ? -2 : (dir === 'right' ? 2 : 0);
          ctx.fillRect(-4 + eyeOff, -31 + bob, 2.2, 3);
          ctx.fillRect(2 + eyeOff, -31 + bob, 2.2, 3);
        }
      }

      if (label) {
        ctx.font = 'bold 9.5px sans-serif';
        const w = ctx.measureText(label).width + 10;
        ctx.fillStyle = 'rgba(2, 6, 23, 0.9)';
        ctx.beginPath();
        ctx.roundRect(-w / 2, 10, w, 14, 4);
        ctx.fill();
        ctx.strokeStyle = labelCol || '#38bdf8';
        ctx.lineWidth = 1.3;
        ctx.stroke();
        ctx.fillStyle = isMentor ? '#fde047' : '#f8fafc';
        ctx.textAlign = 'center';
        ctx.fillText(label, 0, 20);
      }

      ctx.restore();
    }

    let globalTick = 0;

    function updateAndDrawWorld() {
      globalTick++;
      if (state.lockToast.timer > 0) state.lockToast.timer--;
      if (state.lockToast.soundCooldown > 0) state.lockToast.soundCooldown--;

      const worldCanvas = document.getElementById('worldCanvas');
      if (worldCanvas && state.screen === 'hospital') {
        const wctx = worldCanvas.getContext('2d');
        const gCorridor = getMentorCorridorPos();

        // 1) Move Director when no modal is open
        if (!state.activeRoom && !state.theoryModalOpen && !state.mentorModalOpen && !state.winnerModalOpen) {
          let dx = 0, dy = 0;
          if (keys.ArrowLeft) { dx -= 1; state.player.dir = 'left'; }
          if (keys.ArrowRight) { dx += 1; state.player.dir = 'right'; }
          if (keys.ArrowUp) { dy -= 1; state.player.dir = 'up'; }
          if (keys.ArrowDown) { dy += 1; state.player.dir = 'down'; }

          if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }
          state.player.moving = (dx !== 0 || dy !== 0);

          if (state.player.moving) {
            state.player.frame += 1;
            if (state.player.frame % 11 === 0) {
              playSfx('step');
              state.dust.push({ x: state.player.x, y: state.player.y + 4, r: 3.5, life: 18 });
            }
            const nx = state.player.x + dx * state.player.speed;
            const ny = state.player.y + dy * state.player.speed;
            if (isMapWalkable(nx, state.player.y)) state.player.x = nx;
            if (isMapWalkable(state.player.x, ny)) {
              state.player.y = ny;
            } else {
              // Check if bumping into a locked doorway!
              for (let i = 1; i < ROOMS.length; i++) {
                if (isRoomUnlocked(i)) continue;
                const [dx1, dx2] = ROOMS[i].doorX;
                if (state.player.x >= dx1 - 4 && state.player.x <= dx2 + 4) {
                  if ((ROOMS[i].num <= 3 && dy < 0 && state.player.y <= 258) ||
                      (ROOMS[i].num >= 4 && dy > 0 && state.player.y >= 304)) {
                    showLockToast(i);
                  }
                }
              }
            }
          }

          if (spaceTapped && Math.hypot(state.player.x - gCorridor.x, state.player.y - gCorridor.y) < 46) {
            toggleMentorModal();
          } else {
            let nearRoom = null;
            for (let i = 0; i < ROOMS.length; i++) {
              if (!isRoomUnlocked(i)) continue;
              const r = ROOMS[i];
              if (Math.hypot(state.player.x - r.trigger.x, state.player.y - r.trigger.y) < 42) {
                nearRoom = r;
                break;
              }
            }
            if (!nearRoom) {
              state.dismissedRoomId = null;
            } else if (nearRoom.id !== state.dismissedRoomId && !state.completed[nearRoom.id]) {
              openRoomEncounter(nearRoom);
            } else if (nearRoom && spaceTapped) {
              openRoomEncounter(nearRoom);
            }
          }
        }

        // 2) Draw Hospital Floorplan Background
        const mapImg = loadedImages['map'];
        if (mapImg && mapImg.complete && mapImg.naturalWidth > 0) {
          wctx.drawImage(mapImg, 0, 0, 960, 540);
        } else {
          wctx.fillStyle = '#0f172a';
          wctx.fillRect(0, 0, 960, 540);
        }

        // 2b) GPS Floor Guide toward the NEXT UNLOCKED Ward
        const nextIdx = ROOMS.findIndex((r, idx) => isRoomUnlocked(idx) && !state.completed[r.id]);
        if (nextIdx !== -1) {
          const nextRoom = ROOMS[nextIdx];
          const doorMidX = (nextRoom.doorX[0] + nextRoom.doorX[1]) / 2;
          wctx.save();
          wctx.strokeStyle = 'rgba(56, 189, 248, 0.68)';
          wctx.lineWidth = 3;
          wctx.setLineDash([7, 7]);
          wctx.lineDashOffset = -globalTick * 0.9;
          wctx.beginPath();
          wctx.moveTo(state.player.x, state.player.y + 4);
          wctx.lineTo(state.player.x, 281);
          wctx.lineTo(doorMidX, 281);
          wctx.lineTo(doorMidX, nextRoom.trigger.y);
          wctx.lineTo(nextRoom.trigger.x, nextRoom.trigger.y);
          wctx.stroke();
          wctx.restore();
        }

        // 2c) Security Laser Barriers across LOCKED Doorways (Sequential Progression!)
        ROOMS.forEach((r, idx) => {
          if (isRoomUnlocked(idx)) return;
          const [dx1, dx2] = r.doorX;
          const gateY = r.num <= 3 ? 250 : 312;
          wctx.save();
          wctx.strokeStyle = 'rgba(239, 68, 68, 0.9)';
          wctx.shadowColor = '#ef4444';
          wctx.shadowBlur = 10;
          wctx.lineWidth = 4;
          wctx.beginPath();
          wctx.moveTo(dx1 + 4, gateY);
          wctx.lineTo(dx2 - 4, gateY);
          wctx.stroke();

          wctx.setLineDash([5, 5]);
          wctx.strokeStyle = '#fde047';
          wctx.lineWidth = 2;
          wctx.beginPath();
          wctx.moveTo(dx1 + 4, gateY);
          wctx.lineTo(dx2 - 4, gateY);
          wctx.stroke();
          wctx.setLineDash([]);

          // Posts + mini lock tag at doorway
          wctx.fillStyle = '#7f1d1d';
          wctx.strokeStyle = '#f87171';
          wctx.lineWidth = 1.5;
          const midX = (dx1 + dx2) / 2;
          wctx.beginPath();
          wctx.roundRect(midX - 28, gateY - 8, 56, 16, 5);
          wctx.fill();
          wctx.stroke();
          wctx.fillStyle = '#fef2f2';
          wctx.font = '900 8.5px sans-serif';
          wctx.textAlign = 'center';
          wctx.fillText('🔒 LOCKED', midX, gateY + 3);
          wctx.restore();
        });

        // 3) Glowing 10 Gbps Fiber-Optic Conduits once Activated in Ward 3
        if (state.fiberActive) {
          wctx.save();
          wctx.strokeStyle = '#10b981';
          wctx.lineWidth = 4;
          wctx.shadowColor = '#10b981';
          wctx.shadowBlur = 12;
          wctx.setLineDash([10, 8]);
          wctx.lineDashOffset = -globalTick * 1.6;
          wctx.beginPath();
          wctx.moveTo(798, 175); wctx.lineTo(798, 250);
          wctx.lineTo(176, 250); wctx.lineTo(176, 175);
          wctx.moveTo(490, 250); wctx.lineTo(490, 175);
          wctx.moveTo(182, 250); wctx.lineTo(182, 345);
          wctx.moveTo(610, 250); wctx.lineTo(610, 345);
          wctx.stroke();
          wctx.restore();
        }

        // 4) Live Event-Study Chart Projected on the Lecture Hall Screen
        wctx.save();
        wctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
        wctx.fillRect(703, 351, 88, 33);
        wctx.strokeStyle = '#38bdf8';
        wctx.lineWidth = 1;
        wctx.beginPath(); wctx.moveTo(706, 375); wctx.lineTo(788, 375); wctx.stroke();
        const evPts = [377, 376, 375, 375, 374, state.fiberActive ? 364 : 374, state.fiberActive ? 356 : 376];
        wctx.strokeStyle = state.fiberActive ? '#10b981' : '#f59e0b';
        wctx.lineWidth = 2;
        wctx.beginPath();
        evPts.forEach((py, i) => {
          const px = 710 + i * 12;
          if (i === 0) wctx.moveTo(px, py); else wctx.lineTo(px, py);
        });
        wctx.stroke();
        wctx.restore();

        // 5) Footstep dust particles
        state.dust.forEach(d => {
          wctx.fillStyle = `rgba(255,255,255,${d.life / 30})`;
          wctx.beginPath(); wctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); wctx.fill();
          d.life--;
        });
        state.dust = state.dust.filter(d => d.life > 0);

        // 6) Y-sorted Entities (NPCs + Corridor Mentor + Player)
        const entities = [];
        ROOMS.forEach(r => {
          entities.push({ type: 'npc', y: r.npc1.y, data: r.npc1 });
          entities.push({ type: 'npc', y: r.npc2.y, data: r.npc2 });
        });
        entities.push({ type: 'mentor_corridor', y: gCorridor.y, x: gCorridor.x });
        entities.push({ type: 'player', y: state.player.y });
        entities.sort((a, b) => a.y - b.y);

        entities.forEach(ent => {
          if (ent.type === 'npc') {
            const shortName = ent.data.isMentor ? 'PROF. TAURINI' : ent.data.name.split(' ').slice(-1)[0].toUpperCase();
            drawPixelCharacter(wctx, ent.data.x, ent.data.y, ent.data.coat, ent.data.hair, 'down', 0, false, shortName, ent.data.isMentor ? '#eab308' : '#64748b', !!ent.data.isMentor);
          } else if (ent.type === 'mentor_corridor') {
            drawPixelCharacter(wctx, ent.x, ent.y, '#1e3a5f', '#64748b', 'down', globalTick * 0.25, false, '🎓 PROF. TAURINI', '#eab308', true);
            const floatY = ent.y - 54 + Math.sin(globalTick * 0.09) * 3;
            wctx.fillStyle = '#fef08a';
            wctx.strokeStyle = '#0f172a';
            wctx.lineWidth = 1.5;
            wctx.beginPath();
            wctx.roundRect(ent.x - 34, floatY - 9, 68, 16, 6);
            wctx.fill(); wctx.stroke();
            wctx.fillStyle = '#0f172a';
            wctx.font = '900 8.5px sans-serif';
            wctx.textAlign = 'center';
            wctx.fillText('💬 ADVICE', ent.x, floatY + 2);
          } else {
            drawPixelCharacter(wctx, state.player.x, state.player.y, '#f8fafc', '#1e293b', state.player.dir, state.player.frame, state.player.moving, 'DIRECTOR', '#38bdf8', false);
          }
        });

        // 7) Ward Markers (Unlocked '!', Locked '🔒', or Completed '✓')
        ROOMS.forEach((r, idx) => {
          const done = state.completed[r.id];
          const unlocked = isRoomUnlocked(idx);
          const bounce = Math.sin(globalTick * 0.1) * 4;
          const mx = r.trigger.x;
          const my = r.trigger.y - 46 + ((done || !unlocked) ? 0 : bounce);

          const badgeTxt = `${unlocked ? '' : '🔒 '}${r.num}. ${r.name}`;
          wctx.font = 'bold 10.5px sans-serif';
          const tw = wctx.measureText(badgeTxt).width + 18;
          const bx = r.trigger.x;
          const by = r.num <= 3 ? 22 : 528;
          wctx.fillStyle = unlocked ? 'rgba(2, 6, 23, 0.88)' : 'rgba(15, 23, 42, 0.78)';
          wctx.beginPath(); wctx.roundRect(bx - tw / 2, by - 11, tw, 20, 6); wctx.fill();
          wctx.strokeStyle = done ? (done.ok ? '#10b981' : '#f59e0b') : (unlocked ? '#38bdf8' : '#64748b');
          wctx.lineWidth = 1.5;
          wctx.stroke();
          wctx.fillStyle = unlocked ? '#f8fafc' : '#94a3b8';
          wctx.textAlign = 'center';
          wctx.fillText(badgeTxt, bx, by + 3);

          if (done) {
            wctx.fillStyle = done.ok ? '#10b981' : '#f59e0b';
            wctx.beginPath(); wctx.arc(mx, my + 8, 10, 0, Math.PI * 2); wctx.fill();
            wctx.fillStyle = '#020617';
            wctx.font = '900 11px sans-serif';
            wctx.fillText('✓', mx, my + 12);
          } else if (unlocked) {
            wctx.fillStyle = r.id === 'boss' ? '#ef4444' : '#f59e0b';
            wctx.beginPath(); wctx.arc(mx, my, 12, 0, Math.PI * 2); wctx.fill();
            wctx.strokeStyle = '#ffffff';
            wctx.lineWidth = 2;
            wctx.stroke();
            wctx.fillStyle = '#020617';
            wctx.font = '900 13px sans-serif';
            wctx.fillText('!', mx, my + 5);
          } else {
            wctx.fillStyle = 'rgba(15, 23, 42, 0.92)';
            wctx.beginPath(); wctx.arc(mx, my + 6, 12, 0, Math.PI * 2); wctx.fill();
            wctx.strokeStyle = '#ef4444';
            wctx.lineWidth = 1.8;
            wctx.stroke();
            wctx.font = '11px sans-serif';
            wctx.fillText('🔒', mx, my + 10);
          }
        });

        // 7b) Floating Lock Toast Banner on Canvas
        if (state.lockToast.timer > 0) {
          const alpha = Math.min(1, state.lockToast.timer / 25);
          wctx.save();
          wctx.globalAlpha = alpha;
          wctx.font = '900 12.5px sans-serif';
          const tw = wctx.measureText(state.lockToast.msg).width + 34;
          wctx.fillStyle = 'rgba(69, 10, 10, 0.94)';
          wctx.strokeStyle = '#f87171';
          wctx.lineWidth = 2;
          wctx.beginPath();
          wctx.roundRect(480 - tw / 2, 236, tw, 30, 10);
          wctx.fill();
          wctx.stroke();
          wctx.fillStyle = '#fef2f2';
          wctx.textAlign = 'center';
          wctx.fillText(state.lockToast.msg, 480, 255);
          wctx.restore();
        }
      }

      // 8) Animate Winner Confetti Overlay if Open
      if (state.winnerModalOpen) {
        const cc = document.getElementById('winnerConfettiCanvas');
        if (cc) {
          const cctx = cc.getContext('2d');
          cctx.clearRect(0, 0, 760, 460);
          state.confetti.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.rot += p.vrot;
            if (p.y > 470) { p.y = -15; p.x = Math.random() * 760; }
            cctx.save();
            cctx.translate(p.x, p.y);
            cctx.rotate(p.rot);
            cctx.fillStyle = p.col;
            cctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
            cctx.restore();
          });
        }
      }

      // 9) Update Active Mini-Challenge at 60 FPS
      if (state.roomPhase === 'minigame' && state.mg.active) {
        updateAndDrawMinigame();
      }

      spaceTapped = false;
      requestAnimationFrame(updateAndDrawWorld);
    }

    // =========================================================================
    // 7. THE 5 DISTINCT MINI-CHALLENGES (560 x 260 Canvas)
    // =========================================================================
    function updateAndDrawMinigame() {
      const mc = document.getElementById('miniCanvas');
      if (!mc || !state.activeRoom) return;
      const mctx = mc.getContext('2d');
      const mg = state.mg;
      const rId = state.activeRoom.id;
      mg.tick++;
      if (mg.cooldown > 0) mg.cooldown--;
      if (mg.buzzFlash > 0) mg.buzzFlash--;
      if (mg.duelFlash > 0) mg.duelFlash--;

      mctx.fillStyle = mg.buzzFlash > 0 ? '#450a0a' : (mg.duelFlash > 0 ? '#064e3b' : '#020617');
      mctx.fillRect(0, 0, 560, 260);

      // =======================================================================
      // CHALLENGE 1 (OR): DA VINCI STEADY-HAND MICRO-SURGERY MAZE
      // =======================================================================
      if (rId === 'or') {
        mctx.strokeStyle = 'rgba(16, 185, 129, 0.08)';
        mctx.lineWidth = 1;
        for (let x = 0; x < 560; x += 28) { mctx.beginPath(); mctx.moveTo(x, 24); mctx.lineTo(x, 260); mctx.stroke(); }
        for (let y = 24; y < 260; y += 28) { mctx.beginPath(); mctx.moveTo(0, y); mctx.lineTo(560, y); mctx.stroke(); }

        mctx.save();
        mctx.lineCap = 'round';
        mctx.lineJoin = 'round';
        mctx.strokeStyle = mg.buzzFlash > 0 ? '#ef4444' : '#be123c';
        mctx.lineWidth = 58;
        mctx.beginPath();
        OR_PATH.forEach((p, i) => { if (i === 0) mctx.moveTo(p.x, p.y); else mctx.lineTo(p.x, p.y); });
        mctx.stroke();

        mctx.strokeStyle = '#0f172a';
        mctx.lineWidth = 48;
        mctx.stroke();

        if (!mg.tremor) {
          mctx.strokeStyle = 'rgba(56, 189, 248, 0.45)';
          mctx.lineWidth = 2;
          mctx.setLineDash([6, 6]);
          mctx.stroke();
        }
        mctx.restore();

        if (mg.tremor) {
          const pulse = Math.sin(mg.tick * 0.15) * 2.5;
          mctx.fillStyle = '#059669';
          mctx.strokeStyle = '#6ee7b7';
          mctx.lineWidth = 2.5;
          mctx.beginPath(); mctx.arc(134, 148, 17 + pulse, 0, Math.PI * 2); mctx.fill(); mctx.stroke();
          mctx.fillStyle = '#ffffff';
          mctx.font = '900 8.5px sans-serif';
          mctx.textAlign = 'center';
          mctx.fillText('DA VINCI', 134, 146);
          mctx.fillText('ON!', 134, 155);
          if (Math.hypot(mg.px - 134, mg.py - 148) < 23 || spaceTapped) {
            mg.tremor = false;
            playSfx('good');
            spawnParticles(134, 148, '#34d399', 22);
          }
        }

        let vx = 0, vy = 0;
        if (keys.ArrowLeft) vx -= 3.4;
        if (keys.ArrowRight) vx += 3.4;
        if (keys.ArrowUp) vy -= 3.4;
        if (keys.ArrowDown) vy += 3.4;
        if (vx === 0 && vy === 0 && mg.mouseTarget) {
          const dxm = mg.mouseTarget.x - mg.px;
          const dym = mg.mouseTarget.y - mg.py;
          const dm = Math.hypot(dxm, dym);
          if (dm > 2 && dm < 110) {
            vx = (dxm / dm) * Math.min(3.5, dm * 0.25);
            vy = (dym / dm) * Math.min(3.5, dm * 0.25);
          }
        }
        if (mg.tremor) {
          vx += (Math.random() - 0.5) * 6.4;
          vy += (Math.random() - 0.5) * 6.4;
        }
        mg.px = Math.max(30, Math.min(535, mg.px + vx));
        mg.py = Math.max(40, Math.min(242, mg.py + vy));

        const dWall = distToOrPath(mg.px, mg.py);
        if (dWall > 22) {
          playSfx('bad');
          mg.buzzFlash = 10;
          spawnParticles(mg.px, mg.py, '#ef4444', 10);
          mg.px = mg.lastSafeX;
          mg.py = mg.lastSafeY;
        } else {
          mg.lastSafeX = mg.px;
          mg.lastSafeY = mg.py;
        }

        const nextIdx = mg.checkpoints.findIndex(c => !c.done);
        mg.checkpoints.forEach((cp, idx) => {
          const isCurrent = idx === nextIdx;
          mctx.fillStyle = cp.done ? '#10b981' : (isCurrent ? '#0284c7' : '#334155');
          mctx.strokeStyle = cp.done ? '#6ee7b7' : (isCurrent ? '#7dd3fc' : '#64748b');
          mctx.lineWidth = 2.5;
          mctx.beginPath(); mctx.arc(cp.x, cp.y, 15, 0, Math.PI * 2); mctx.fill(); mctx.stroke();
          mctx.fillStyle = '#fff';
          mctx.font = '900 7.5px sans-serif';
          mctx.textAlign = 'center';
          mctx.fillText(cp.done ? '✓ OK' : cp.label, cp.x, cp.y + 3);

          if (isCurrent && Math.hypot(mg.px - cp.x, mg.py - cp.y) < 19) {
            cp.done = true;
            mg.progress++;
            playSfx('open');
            spawnParticles(cp.x, cp.y, '#38bdf8', 18);
          }
        });

        mctx.strokeStyle = mg.tremor ? '#f59e0b' : '#38bdf8';
        mctx.lineWidth = mg.tremor ? 2.5 : 4;
        if (!mg.tremor) {
          mctx.beginPath();
          mctx.moveTo(20, 255); mctx.lineTo(mg.px - 7, mg.py + 4);
          mctx.moveTo(540, 255); mctx.lineTo(mg.px + 7, mg.py + 4);
          mctx.stroke();
        }
        mctx.fillStyle = mg.tremor ? '#fbbf24' : '#38bdf8';
        mctx.beginPath(); mctx.arc(mg.px, mg.py, 7, 0, Math.PI * 2); mctx.fill();
        mctx.strokeStyle = '#ffffff'; mctx.lineWidth = 2; mctx.stroke();
      }

      // =======================================================================
      // CHALLENGE 2 (RADIOLOGY): AI DATA SNAKE (20x10 GRID)
      // =======================================================================
      else if (rId === 'rad') {
        const gx0 = 20, gy0 = 30, cw = 26, ch = 22;
        mctx.fillStyle = '#091124';
        mctx.fillRect(gx0, gy0, 20 * cw, 10 * ch);
        mctx.strokeStyle = 'rgba(56, 189, 248, 0.14)';
        mctx.lineWidth = 1;
        for (let c = 0; c <= 20; c++) { mctx.beginPath(); mctx.moveTo(gx0 + c * cw, gy0); mctx.lineTo(gx0 + c * cw, gy0 + 10 * ch); mctx.stroke(); }
        for (let r = 0; r <= 10; r++) { mctx.beginPath(); mctx.moveTo(gx0, gy0 + r * ch); mctx.lineTo(gx0 + 20 * cw, gy0 + r * ch); mctx.stroke(); }

        if (mg.tick % 8 === 0) {
          if (mg.dirQueue.length) mg.snakeDir = mg.dirQueue.shift();
          const head = mg.snake[0];
          const nx = head.x + mg.snakeDir.x;
          const ny = head.y + mg.snakeDir.y;
          const hitWall = nx < 0 || nx >= 20 || ny < 0 || ny >= 10;
          const hitSelf = mg.snake.some(s => s.x === nx && s.y === ny);
          const hitLock = mg.locks.some(l => l.x === nx && l.y === ny);

          if (hitWall || hitSelf || hitLock) {
            playSfx('bad');
            mg.buzzFlash = 12;
            mg.progress = Math.max(0, mg.progress - 1);
            mg.snake = [{ x: 5, y: 5 }, { x: 4, y: 5 }, { x: 3, y: 5 }];
            mg.snakeDir = { x: 1, y: 0 };
            mg.dirQueue = [];
          } else {
            mg.snake.unshift({ x: nx, y: ny });
            if (nx === mg.food.x && ny === mg.food.y) {
              mg.progress++;
              playSfx('open');
              spawnParticles(gx0 + nx * cw + 13, gy0 + ny * ch + 11, '#38bdf8', 16);
              spawnSnakeFood();
            } else {
              mg.snake.pop();
            }
          }
        }

        mg.locks.forEach(l => {
          const lx = gx0 + l.x * cw, ly = gy0 + l.y * ch;
          mctx.fillStyle = '#991b1b';
          mctx.strokeStyle = '#f87171';
          mctx.lineWidth = 1.5;
          mctx.beginPath(); mctx.roundRect(lx + 2, ly + 2, cw - 4, ch - 4, 4); mctx.fill(); mctx.stroke();
          mctx.fillStyle = '#fff'; mctx.font = 'bold 9px sans-serif'; mctx.textAlign = 'center';
          mctx.fillText('🔒', lx + cw / 2, ly + 15);
        });

        const fx = gx0 + mg.food.x * cw + cw / 2;
        const fy = gy0 + mg.food.y * ch + ch / 2;
        const fpulse = Math.sin(mg.tick * 0.2) * 2;
        mctx.fillStyle = '#0284c7';
        mctx.strokeStyle = '#7dd3fc';
        mctx.lineWidth = 2;
        mctx.beginPath(); mctx.arc(fx, fy, 9 + fpulse, 0, Math.PI * 2); mctx.fill(); mctx.stroke();
        mctx.fillStyle = '#fff'; mctx.font = '900 7.5px sans-serif'; mctx.textAlign = 'center';
        mctx.fillText('CT', fx, fy + 3);

        mg.snake.forEach((seg, idx) => {
          const sx = gx0 + seg.x * cw, sy = gy0 + seg.y * ch;
          mctx.fillStyle = idx === 0 ? '#10b981' : (idx % 2 === 0 ? '#059669' : '#0d9488');
          mctx.strokeStyle = idx === 0 ? '#a7f3d0' : '#022c22';
          mctx.lineWidth = 1.5;
          mctx.beginPath(); mctx.roundRect(sx + 1.5, sy + 1.5, cw - 3, ch - 3, idx === 0 ? 6 : 4); mctx.fill(); mctx.stroke();
          if (idx === 0) {
            mctx.fillStyle = '#020617';
            mctx.fillRect(sx + 7, sy + 6, 3, 3);
            mctx.fillRect(sx + 16, sy + 6, 3, 3);
          } else {
            mctx.fillStyle = '#ecfdf5';
            mctx.font = 'bold 7.5px sans-serif';
            mctx.textAlign = 'center';
            mctx.fillText(`H${idx}`, sx + cw / 2, sy + 14);
          }
        });
      }

      // =======================================================================
      // CHALLENGE 3 (SERVER ROOM): 10 Gbps FIBER PIPE PUZZLE
      // =======================================================================
      else if (rId === 'server') {
        const gx0 = 110, gy0 = 48, tw = 68, th = 64;

        mctx.strokeStyle = '#64748b';
        mctx.lineWidth = 3;
        mctx.setLineDash([4, 4]);
        mctx.beginPath(); mctx.moveTo(12, 36); mctx.lineTo(95, 36); mctx.stroke();
        mctx.setLineDash([]);
        mctx.fillStyle = '#f87171'; mctx.font = 'bold 8.5px sans-serif'; mctx.textAlign = 'left';
        mctx.fillText('✕ Infratel 2019 (street only)', 12, 32);

        mctx.fillStyle = '#064e3b'; mctx.strokeStyle = '#10b981'; mctx.lineWidth = 2.5;
        mctx.beginPath(); mctx.roundRect(10, 108, 92, 72, 10); mctx.fill(); mctx.stroke();
        mctx.fillStyle = '#6ee7b7'; mctx.font = '900 9.5px sans-serif'; mctx.textAlign = 'center';
        mctx.fillText('PNRR CABINET', 56, 134);
        mctx.fillStyle = '#ffffff'; mctx.font = 'bold 8.5px sans-serif';
        mctx.fillText('Sanità Connessa', 56, 149);
        mctx.fillText('⚡ 10 Gbps', 56, 164);
        mctx.strokeStyle = '#10b981'; mctx.lineWidth = 8;
        mctx.beginPath(); mctx.moveTo(102, 144); mctx.lineTo(112, 144); mctx.stroke();

        mctx.fillStyle = mg.pipeSolved ? '#065f46' : '#1e293b';
        mctx.strokeStyle = mg.pipeSolved ? '#34d399' : '#38bdf8';
        mctx.lineWidth = 2.5;
        mctx.beginPath(); mctx.roundRect(458, 100, 92, 88, 10); mctx.fill(); mctx.stroke();
        mctx.fillStyle = '#38bdf8'; mctx.font = '900 9.5px sans-serif'; mctx.textAlign = 'center';
        mctx.fillText('HOSPITAL', 504, 124);
        mctx.fillStyle = '#e2e8f0'; mctx.font = 'bold 8.5px sans-serif';
        mctx.fillText('CT 100 MB', 504, 141);
        mctx.fillText('Slide 1 GB+', 504, 155);
        mctx.fillText(mg.pipeSolved ? '✅ CONNECTED!' : '⏳ Waiting...', 504, 173);
        mctx.strokeStyle = mg.pipeSolved ? '#10b981' : '#334155'; mctx.lineWidth = 8;
        mctx.beginPath(); mctx.moveTo(450, 144); mctx.lineTo(458, 144); mctx.stroke();

        for (let r = 0; r < 3; r++) {
          for (let c = 0; c < 5; c++) {
            const cell = mg.pipes[r][c];
            const x = gx0 + c * tw, y = gy0 + r * th;
            const cx = x + tw / 2, cy = y + th / 2;
            const isSel = (c === mg.selCol && r === mg.selRow);

            mctx.fillStyle = cell.powered ? '#052e16' : '#0f172a';
            mctx.strokeStyle = isSel ? '#facc15' : (cell.powered ? '#10b981' : '#334155');
            mctx.lineWidth = isSel ? 2.5 : 1.5;
            mctx.beginPath(); mctx.roundRect(x + 3, y + 3, tw - 6, th - 6, 8); mctx.fill(); mctx.stroke();

            const ports = getPipePorts(cell.type, cell.rot);
            mctx.strokeStyle = cell.powered ? '#059669' : '#475569';
            mctx.lineWidth = 12;
            mctx.lineCap = 'round';
            mctx.beginPath();
            if (ports[0]) { mctx.moveTo(cx, cy); mctx.lineTo(cx, y + 4); }
            if (ports[1]) { mctx.moveTo(cx, cy); mctx.lineTo(x + tw - 4, cy); }
            if (ports[2]) { mctx.moveTo(cx, cy); mctx.lineTo(cx, y + th - 4); }
            if (ports[3]) { mctx.moveTo(cx, cy); mctx.lineTo(x + 4, cy); }
            mctx.stroke();

            mctx.strokeStyle = cell.powered ? '#6ee7b7' : '#94a3b8';
            mctx.lineWidth = 4;
            mctx.stroke();
          }
        }

        if (mg.pipeSolved) {
          mg.pipeSolvedTimer--;
          if (mg.pipeSolvedTimer <= 0 && !mg.won) {
            mg.won = true; mg.active = false;
            state.roomPhase = 'decision';
            renderModalAndTheory();
            return;
          }
        }
      }

      // =======================================================================
      // CHALLENGE 4 (CONVERGENCE): PATENTS & HTA BREAKOUT
      // =======================================================================
      else if (rId === 'conv') {
        if (keys.ArrowLeft) mg.px -= 6.8;
        if (keys.ArrowRight) mg.px += 6.8;
        mg.px = Math.max(mg.paddleW / 2 + 8, Math.min(552 - mg.paddleW / 2, mg.px));

        mg.bricks.forEach(b => {
          if (!b.alive) return;
          mctx.fillStyle = b.col;
          mctx.strokeStyle = b.stroke;
          mctx.lineWidth = 1.5;
          mctx.beginPath(); mctx.roundRect(b.x, b.y, b.w, b.h, 5); mctx.fill(); mctx.stroke();
          mctx.fillStyle = '#ffffff';
          mctx.font = 'bold 8.5px sans-serif';
          mctx.textAlign = 'center';
          mctx.fillText(b.txt, b.x + b.w / 2, b.y + 14);
        });

        if (mg.capsule) {
          mg.capsule.y += 2.3;
          mctx.fillStyle = '#10b981'; mctx.strokeStyle = '#a7f3d0'; mctx.lineWidth = 2;
          mctx.beginPath(); mctx.roundRect(mg.capsule.x - 48, mg.capsule.y - 10, 96, 20, 10); mctx.fill(); mctx.stroke();
          mctx.fillStyle = '#020617'; mctx.font = '900 8.5px sans-serif'; mctx.textAlign = 'center';
          mctx.fillText('⚡ CONSIP MULTIBALL', mg.capsule.x, mg.capsule.y + 3);
          if (mg.capsule.y >= 224 && mg.capsule.y <= 248 && Math.abs(mg.capsule.x - mg.px) < mg.paddleW / 2 + 30) {
            playSfx('good');
            mg.paddleW = 138;
            mg.balls.push({ x: mg.px, y: 220, vx: -3.5, vy: -4.1 });
            mg.capsule = null;
          } else if (mg.capsule && mg.capsule.y > 265) {
            mg.capsule = null;
          }
        }

        mg.balls.forEach(bl => {
          bl.x += bl.vx; bl.y += bl.vy;
          if (bl.x < 10 || bl.x > 550) bl.vx *= -1;
          if (bl.y < 30) bl.vy = Math.abs(bl.vy);

          if (bl.vy > 0 && bl.y >= 228 && bl.y <= 244 && Math.abs(bl.x - mg.px) <= mg.paddleW / 2 + 7) {
            const hitOff = (bl.x - mg.px) / (mg.paddleW / 2);
            bl.vx = hitOff * 4.8;
            bl.vy = -Math.max(3.6, Math.abs(bl.vy));
            playSfx('step');
          }

          for (const b of mg.bricks) {
            if (!b.alive) continue;
            if (bl.x >= b.x - 5 && bl.x <= b.x + b.w + 5 && bl.y >= b.y - 5 && bl.y <= b.y + b.h + 5) {
              b.alive = false;
              bl.vy *= -1;
              mg.progress++;
              playSfx('open');
              spawnParticles(b.x + b.w / 2, b.y + 11, b.stroke, 12);
              if (mg.progress === 3 && !mg.capsule) {
                mg.capsule = { x: b.x + b.w / 2, y: b.y + 12 };
              }
              break;
            }
          }

          mctx.fillStyle = '#38bdf8';
          mctx.beginPath(); mctx.arc(bl.x, bl.y, 7, 0, Math.PI * 2); mctx.fill();
          mctx.strokeStyle = '#ffffff'; mctx.lineWidth = 2; mctx.stroke();
        });

        mg.balls = mg.balls.filter(bl => bl.y < 262);
        if (mg.balls.length === 0) {
          playSfx('bad');
          mg.balls.push({ x: mg.px, y: 220, vx: (Math.random() > 0.5 ? 3.2 : -3.2), vy: -3.9 });
        }

        mctx.fillStyle = '#0284c7';
        mctx.strokeStyle = '#7dd3fc';
        mctx.lineWidth = 2.5;
        mctx.beginPath(); mctx.roundRect(mg.px - mg.paddleW / 2, 234, mg.paddleW, 14, 7); mctx.fill(); mctx.stroke();
        mctx.fillStyle = '#ffffff'; mctx.font = '900 8.5px sans-serif'; mctx.textAlign = 'center';
        mctx.fillText('3D AR VISOR • CONSIP', mg.px, 244);
      }

      // =======================================================================
      // CHALLENGE 5 (LECTURE HALL): TURN-BASED DUEL vs. REFEREE #2
      // =======================================================================
      else if (rId === 'boss') {
        const rd = BOSS_ROUNDS[Math.min(mg.roundIdx, BOSS_ROUNDS.length - 1)];

        mctx.fillStyle = 'rgba(239, 68, 68, 0.18)';
        mctx.beginPath(); mctx.ellipse(455, 108, 66, 18, 0, 0, Math.PI * 2); mctx.fill();
        drawPixelCharacter(mctx, 455, 98, '#78350f', '#1e293b', 'down', 0, false, 'REFEREE #2', '#ef4444', false);

        mctx.fillStyle = '#0f172a'; mctx.strokeStyle = '#ef4444'; mctx.lineWidth = 2;
        mctx.beginPath(); mctx.roundRect(14, 30, 210, 38, 8); mctx.fill(); mctx.stroke();
        mctx.fillStyle = '#fca5a5'; mctx.font = '900 10px sans-serif'; mctx.textAlign = 'left';
        mctx.fillText(`BOSS: REFEREE #2   HP ${mg.bossHp}/100`, 24, 45);
        mctx.fillStyle = '#1e293b'; mctx.fillRect(24, 52, 188, 8);
        mctx.fillStyle = mg.bossHp > 40 ? '#ef4444' : '#f59e0b';
        mctx.fillRect(24, 52, (188 * mg.bossHp) / 100, 8);

        mctx.fillStyle = '#450a0a'; mctx.strokeStyle = '#f87171'; mctx.lineWidth = 1.8;
        mctx.beginPath(); mctx.roundRect(14, 76, 365, 44, 10); mctx.fill(); mctx.stroke();
        mctx.fillStyle = '#ffffff'; mctx.font = 'bold 9.5px sans-serif'; mctx.textAlign = 'left';
        const words = rd.atk.split(' ');
        let line1 = '', line2 = '';
        words.forEach(w => { if ((line1 + w).length < 56) line1 += w + ' '; else line2 += w + ' '; });
        mctx.fillText(line1.trim(), 24, 94);
        mctx.fillText(line2.trim(), 24, 110);

        mctx.fillStyle = 'rgba(56, 189, 248, 0.18)';
        mctx.beginPath(); mctx.ellipse(92, 182, 74, 16, 0, 0, Math.PI * 2); mctx.fill();
        drawPixelCharacter(mctx, 64, 174, '#f8fafc', '#1e293b', 'right', 0, false, '', '#38bdf8', false);
        drawPixelCharacter(mctx, 120, 174, '#1e3a5f', '#64748b', 'down', 0, false, 'PROF. TAURINI', '#eab308', true);

        mctx.fillStyle = '#0c4a6e'; mctx.strokeStyle = '#38bdf8'; mctx.lineWidth = 1.5;
        mctx.beginPath(); mctx.roundRect(178, 134, 368, 34, 8); mctx.fill(); mctx.stroke();
        mctx.fillStyle = '#fde047'; mctx.font = 'bold 9px sans-serif'; mctx.textAlign = 'left';
        mctx.fillText(mg.duelMsg, 188, 155, 348);

        rd.moves.forEach((mv, idx) => {
          const bx = 14 + idx * 179, by = 204;
          const sel = mg.selMove === idx;
          mctx.fillStyle = sel ? '#1e3a8a' : '#0f172a';
          mctx.strokeStyle = sel ? '#38bdf8' : '#475569';
          mctx.lineWidth = sel ? 2.5 : 1.5;
          mctx.beginPath(); mctx.roundRect(bx, by, 172, 46, 9); mctx.fill(); mctx.stroke();
          mctx.fillStyle = sel ? '#fde047' : '#e2e8f0';
          mctx.font = '900 9.5px sans-serif';
          mctx.textAlign = 'center';
          mctx.fillText(mv.txt, bx + 86, by + 27, 160);
        });
      }

      mg.particles.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.life--;
        mctx.fillStyle = p.col;
        mctx.globalAlpha = Math.max(0, p.life / 22);
        mctx.beginPath(); mctx.arc(p.x, p.y, 3, 0, Math.PI * 2); mctx.fill();
        mctx.globalAlpha = 1;
      });
      mg.particles = mg.particles.filter(p => p.life > 0);

      mctx.fillStyle = 'rgba(2, 6, 23, 0.9)';
      mctx.fillRect(0, 0, 560, 23);
      mctx.fillStyle = '#34d399';
      mctx.font = '900 10.5px sans-serif';
      mctx.textAlign = 'center';
      const statusLabel =
        rId === 'or' ? `🩺 SUTURES: ${mg.progress}/${mg.goal}  •  ${mg.tremor ? '⚠️ FREEHAND TREMOR (Touch DA VINCI!)' : '🤖 DA VINCI TREMOR FILTER ACTIVE!'}` :

        rId === 'conv' ? `🧱 PATENT & HTA BRICKS SHATTERED: ${mg.progress}/${mg.goal}` :
        `⚔️ ROUND ${Math.min(3, mg.roundIdx + 1)}/3 — CLICK THE ECONOMETRIC COUNTER-MOVE (OR KEYS 1-2-3)!`;
      mctx.fillText(statusLabel, 280, 15);

      if (mg.progress >= mg.goal && rId !== 'server' && !mg.won) {
        mg.won = true;
        mg.active = false;
        playSfx('good');
        state.roomPhase = 'decision';
        renderModalAndTheory();
      }
    }

            <div>
              <span class="text-xs font-black uppercase tracking-wider text-cyan-400">${r.badge} • YEARS ${r.year}</span>
              <h3 class="text-lg md:text-xl font-black text-white">${r.num}. ${r.name}</h3>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="toggleTheoryModal()" class="px-3 py-1 rounded-lg bg-indigo-600/30 border border-indigo-400 text-indigo-200 text-xs font-bold cursor-pointer">
                📖 Ward Theory Notes
              </button>
              <button onclick="closeRoomEncounter()" class="px-3 py-1 rounded-lg bg-slate-800 border border-slate-700 text-xs font-bold cursor-pointer">
                Back to Corridor ✕
              </button>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5">
            ${[r.npc1, r.npc2].map((npc, idx) => `
              <div class="p-3.5 rounded-2xl bg-slate-950 border border-slate-800 flex gap-3.5 items-center">
                <img src="${GAME_ASSETS[npc.portrait]}" alt="${npc.name}" class="w-20 h-20 rounded-xl object-cover border-2 border-cyan-500/50 portrait-glow shrink-0" />
                <div class="space-y-1">
                  <div class="font-black text-xs md:text-sm text-white">${npc.name}</div>
                  <div class="text-[11px] font-bold text-cyan-400">${npc.role}</div>
                  <p class="text-xs text-slate-300 leading-relaxed italic">${r.dialogues[idx].text}</p>
                </div>
              </div>
            `).join('')}
          </div>

          ${state.roomPhase === 'dialogue' ? `
            <div class="p-4 rounded-2xl bg-gradient-to-r from-cyan-950/60 to-fuchsia-950/60 border border-cyan-500/40 flex flex-wrap items-center justify-between gap-3">
              <div class="space-y-0.5">
                <div class="text-xs font-black text-cyan-300">🕹️ HANDS-ON WARD SIMULATION BEFORE YOU DECIDE:</div>
                <div class="text-xs text-slate-300">${r.minigameTitle}</div>
              </div>
              <div class="flex gap-2">
                <button onclick="state.roomPhase='decision'; renderModalAndTheory();" class="px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-xs font-bold text-slate-300 cursor-pointer">
                  Skip Challenge
                </button>
                <button onclick="startRoomMinigame()" class="px-5 py-2 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-black text-xs md:text-sm shadow-lg cursor-pointer">
                  🕹️ START WARD CHALLENGE →
                </button>
              </div>
            </div>
          ` : ''}

          ${state.roomPhase === 'minigame' ? `
            <div class="p-3.5 rounded-2xl bg-slate-950 border-2 border-fuchsia-500/60 space-y-2">
              <div class="flex items-center justify-between text-xs">
                <span class="font-black text-fuchsia-300">${r.minigameTitle}</span>
                <button onclick="state.mg.active=false; state.roomPhase='decision'; renderModalAndTheory();" class="text-slate-400 underline cursor-pointer">Skip challenge &amp; make decision →</button>
              </div>
              <p class="text-xs text-slate-300">${r.minigameHint}</p>
              <canvas id="miniCanvas" width="560" height="260" onmousemove="handleMiniMouseMove(event)" onclick="handleMiniClick(event)" class="w-full h-auto rounded-xl border border-slate-800 block cursor-pointer"></canvas>
              <div class="flex flex-wrap justify-center gap-2 pt-1">
                ${r.id === 'boss' ? `
                  <button onclick="triggerBossMove(0)" class="dpad-btn px-4 py-1.5 rounded-lg bg-indigo-900 border border-cyan-400 font-black text-xs text-white cursor-pointer">⚡ Move 1</button>
                  <button onclick="triggerBossMove(1)" class="dpad-btn px-4 py-1.5 rounded-lg bg-indigo-900 border border-cyan-400 font-black text-xs text-white cursor-pointer">⚡ Move 2</button>
                  <button onclick="triggerBossMove(2)" class="dpad-btn px-4 py-1.5 rounded-lg bg-indigo-900 border border-cyan-400 font-black text-xs text-white cursor-pointer">⚡ Move 3</button>
                ` : `
                  <button onmousedown="setKey('ArrowLeft',true)" onmouseup="setKey('ArrowLeft',false)" ontouchstart="setKey('ArrowLeft',true)" ontouchend="setKey('ArrowLeft',false)" class="dpad-btn px-4 py-1.5 rounded-lg bg-slate-800 border border-slate-700 font-bold text-xs cursor-pointer">◀</button>
                  <button onmousedown="setKey('ArrowUp',true)" onmouseup="setKey('ArrowUp',false)" ontouchstart="setKey('ArrowUp',true)" ontouchend="setKey('ArrowUp',false)" class="dpad-btn px-4 py-1.5 rounded-lg bg-slate-800 border border-slate-700 font-bold text-xs cursor-pointer">▲</button>
                  <button onmousedown="setKey('ArrowDown',true)" onmouseup="setKey('ArrowDown',false)" ontouchstart="setKey('ArrowDown',true)" ontouchend="setKey('ArrowDown',false)" class="dpad-btn px-4 py-1.5 rounded-lg bg-slate-800 border border-slate-700 font-bold text-xs cursor-pointer">▼</button>
                  <button onmousedown="setKey('ArrowRight',true)" onmouseup="setKey('ArrowRight',false)" ontouchstart="setKey('ArrowRight',true)" ontouchend="setKey('ArrowRight',false)" class="dpad-btn px-4 py-1.5 rounded-lg bg-slate-800 border border-slate-700 font-bold text-xs cursor-pointer">▶</button>
                  <button onmousedown="setKey('Space',true)" onmouseup="setKey('Space',false)" ontouchstart="setKey('Space',true)" ontouchend="setKey('Space',false)" class="dpad-btn px-5 py-1.5 rounded-lg bg-fuchsia-600 font-black text-xs text-white cursor-pointer">⚡ SPACE / ACTION</button>
                `}
              </div>
            </div>
          ` : ''}

          ${state.roomPhase === 'decision' && !comp ? `
            <div class="space-y-2.5 pt-1">
              <div class="font-black text-sm text-emerald-400">🎉 Challenge cleared! Now make the ${r.question}</div>
              ${r.choices.map((c, idx) => `
                <button onclick="commitRoomDecision(${idx})" class="w-full text-left p-3.5 rounded-xl bg-slate-950 border-2 border-slate-800 hover:border-cyan-400 text-xs md:text-sm font-medium leading-relaxed cursor-pointer transition-all">
                  ${c.label}
                </button>
              `).join('')}
            </div>
          ` : ''}

          ${comp ? `
            <div class="p-4 rounded-2xl border-2 ${comp.ok ? 'border-emerald-500 bg-emerald-950/30' : 'border-amber-500 bg-amber-950/30'} space-y-2.5">
              <div class="flex items-center justify-between text-xs font-black">
                <span class="${comp.ok ? 'text-emerald-400' : 'text-amber-400'}">${comp.ok ? '✅ POSITIVE OUTCOME:' : '⚠️ ADVERSE OUTCOME:'} ${comp.summary}</span>
                <span>Clinical AI Papers ${comp.deltas.papers >= 0 ? '+' + comp.deltas.papers : comp.deltas.papers}/yr</span>
              </div>
              <p class="text-xs md:text-sm text-slate-200 leading-relaxed">${comp.feedback}</p>
              ${nextWard ? `
                <div class="p-2.5 rounded-xl bg-cyan-950/70 border border-cyan-400/60 text-xs font-black text-cyan-200 flex items-center justify-between">
                  <span>🔓 NEXT WARD UNLOCKED: Ward ${nextWard.num} — ${nextWard.name}!</span>
                </div>
              ` : ''}
              <div class="pt-1 flex justify-end gap-2">
                ${r.id === 'boss' ? `
                  <button onclick="openWinnerCelebration()" class="px-5 py-2 rounded-xl bg-yellow-400 hover:bg-yellow-300 text-slate-950 font-black text-xs md:text-sm cursor-pointer">
                    🏆 Open WINNER! Celebration →
                  </button>
                ` : `
                  <button onclick="closeRoomEncounter()" class="px-5 py-2 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-black text-xs md:text-sm cursor-pointer">
                    🚶‍♂️ Step Out &amp; Walk to Ward ${r.num + 1} →
                  </button>
                `}
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    function renderHospitalScreen() {
      return `
        <div id="hudBar" class="bg-slate-900/95 border border-slate-800 rounded-2xl px-4 py-2.5 shadow-lg space-y-1.5"></div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 items-start">
          <div class="lg:col-span-8 space-y-2">
            <div class="relative rounded-2xl overflow-hidden border-2 border-cyan-500/40 bg-slate-950">
              <canvas id="worldCanvas" onclick="handleCanvasClick(event)" width="960" height="540" class="w-full h-auto block pixel-canvas cursor-pointer"></canvas>
            </div>

            <div class="flex flex-wrap items-center justify-between gap-2 bg-slate-900/90 border border-slate-800 rounded-xl px-3.5 py-2 text-xs">
              <span class="text-slate-300">🚶‍♂️ Move the <strong>Director</strong> with <strong>⬆️ ⬇️ ⬅️ ➡️</strong> down the corridor—complete each ward to unlock the next security gate!</span>
              <div class="flex items-center gap-1">
                <button onmousedown="setKey('ArrowLeft',true)" onmouseup="setKey('ArrowLeft',false)" ontouchstart="setKey('ArrowLeft',true)" ontouchend="setKey('ArrowLeft',false)" class="dpad-btn px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 font-bold">◀</button>
                <button onmousedown="setKey('ArrowUp',true)" onmouseup="setKey('ArrowUp',false)" ontouchstart="setKey('ArrowUp',true)" ontouchend="setKey('ArrowUp',false)" class="dpad-btn px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 font-bold">▲</button>
                <button onmousedown="setKey('ArrowDown',true)" onmouseup="setKey('ArrowDown',false)" ontouchstart="setKey('ArrowDown',true)" ontouchend="setKey('ArrowDown',false)" class="dpad-btn px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 font-bold">▼</button>
                <button onmousedown="setKey('ArrowRight',true)" onmouseup="setKey('ArrowRight',false)" ontouchstart="setKey('ArrowRight',true)" ontouchend="setKey('ArrowRight',false)" class="dpad-btn px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 font-bold">▶</button>
              </div>
            </div>
          </div>

          <div class="lg:col-span-4 bg-slate-900/95 border border-slate-800 rounded-2xl p-4 shadow-xl max-h-[595px] overflow-y-auto space-y-2">
            <div class="flex items-center justify-between border-b border-slate-800 pb-2">
              <span class="text-xs font-black uppercase tracking-wider text-cyan-400">📚 LECTURE THEORY &amp; METHOD BOXES</span>
              <button onclick="toggleTheoryModal()" class="text-xs text-indigo-300 underline cursor-pointer">Expand ⤢</button>
            </div>
            <div id="theorySidePanel"></div>
          </div>
        </div>

        <div id="roomEncounterModal" class="hidden"></div>
        <div id="mentorPopupModal" class="hidden"></div>
        <div id="theoryPopupModal" class="hidden"></div>
        <div id="winnerPopupModal" class="hidden"></div>
      `;
    }

    function renderDiplomaScreen() {
      const okCount = Object.values(state.completed).filter(c => c.ok).length;
      return `
        <div class="bg-slate-900 border-2 border-emerald-500/60 rounded-3xl p-6 md:p-8 shadow-2xl space-y-6">
          <div class="flex flex-wrap items-center justify-between gap-4 border-b border-slate-800 pb-5">
            <div class="flex items-center gap-4">
              <img src="${GAME_ASSETS['p_mentor']}" alt="Prof. Arturo Taurini" class="w-20 h-20 rounded-2xl border-2 border-amber-400 object-cover portrait-glow" />
              <div>
                <span class="px-3 py-1 rounded-full text-xs font-black bg-emerald-500/20 text-emerald-300">
                  🏆 SIMULATION COMPLETED (2019–2026) • PAPER ACCEPTED!
                </span>
                <h1 class="text-2xl md:text-3xl font-black text-white mt-1">
                  Optimal Director Decisions: ${okCount} / 5 • Clinical AI Output: ${state.aiPapers}/yr
                </h1>
                <p class="text-xs text-slate-400">
                  Complete 5-Chapter Executive &amp; Methodological Reference Sheet
                </p>
              </div>
            </div>
            <div class="flex gap-2">
              <button onclick="state.screen='hospital'; renderApp();" class="px-4 py-2 rounded-xl bg-slate-800 border border-slate-700 text-xs font-bold cursor-pointer">
                🚶‍♂️ Back to Hospital
              </button>
              <button onclick="state.screen='cover'; renderApp();" class="px-4 py-2 rounded-xl bg-cyan-500 text-slate-950 font-black text-xs cursor-pointer">
                🔄 Replay with the Other Hospital
              </button>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            ${Object.values(THEORY_CHAPTERS).map(ch => `
              <div class="p-4 rounded-2xl bg-slate-950 border border-slate-800 space-y-2">
                <h3 class="font-black text-sm text-cyan-400">${ch.title}</h3>
                ${ch.sections.map(s => `
                  <div class="text-xs text-slate-300 space-y-1">
                    <div class="font-bold text-white">${s.heading}</div>
                    <ul class="space-y-1">${s.items.map(i => `<li>• ${i}</li>`).join('')}</ul>
                  </div>
                `).join('')}
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderApp() {
      const root = document.getElementById('app');
      if (state.screen === 'cover') {
        root.innerHTML = renderCoverScreen();
      } else if (state.screen === 'hospital') {
        root.innerHTML = renderHospitalScreen();
        renderHudBar();
        renderModalAndTheory();
      } else {
        root.innerHTML = renderDiplomaScreen();
      }
    }

    renderApp();
    requestAnimationFrame(updateAndDrawWorld);
  </script>
</body>
</html>
